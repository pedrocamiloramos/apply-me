[project]
name = "apply-me"
version = "0.1.0"
description = "Apoio à preparação e gestão de candidaturas, com verificações determinísticas dos factos"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1,<7",
    "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["testes"]
